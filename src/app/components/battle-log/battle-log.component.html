<div class="battle-log">
    <div class="battle-log-header">
        <h3>Battle Log</h3>
    </div>
    <div class="battle-log-content" #logContainer>
        @if (logs().length === 0) {
        <div class="log-empty">
            <p>Waiting for battle to start...</p>
        </div>
        } @else {
        @for (log of logs(); track log.timestamp) {
        <div class="log-entry" [ngClass]="getLogClass(log.type)">
            <span class="log-message">{{ log.message }}</span>
        </div>
        }
        }
    </div>
</div>
