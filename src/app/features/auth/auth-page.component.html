<section class="auth-page">
  <div class="auth-card">
    <h1>Accesso area protetta</h1>
    <p class="subtitle">Fai login o registrati per usare la modalità riservata.</p>

    <div class="auth-tabs">
      <button type="button" [class.active]="mode() === 'login'" (click)="setMode('login')">Login</button>
      <button type="button" [class.active]="mode() === 'register'" (click)="setMode('register')">Registrati</button>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      @if (mode() === 'register') {
      <label>
        Nickname
        <input type="text" [(ngModel)]="nickname" name="nickname" placeholder="Il tuo nickname" />
      </label>
      }

      <label>
        Email
        <input type="email" [(ngModel)]="email" name="email" placeholder="nome@email.com" required />
      </label>

      <label>
        Password
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </label>

      <button class="submit" type="submit" [disabled]="isSubmitting()">
        {{ mode() === 'login' ? 'Entra' : 'Crea account' }}
      </button>
    </form>

    @if (message()) {
    <p class="message">{{ message() }}</p>
    }

    @if (auth.authError()) {
    <p class="error">{{ auth.authError() }}</p>
    }
  </div>
</section>
